spring.application.name=service
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false

# --- H2 file-based database ---
# Data persists in ./data/traffic-law.mv.db across application restarts.
spring.datasource.url=jdbc:h2:file:./data/traffic-law;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 web console (http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update = on startup Hibernate adjusts schema to match @Entity classes (good for dev).
# Switch to "validate" or use Flyway/Liquibase for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Tell Spring where JPA entities live (model module) ---
spring.jpa.entity-scan=com.ftn.sbnz.model
